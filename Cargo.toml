[package]
name = "rsdiskwrite"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
description = "Windows disk image writer with an AcmeUI Native interface"
license = "MIT"

[lib]
name = "rsdiskwrite"
path = "src/lib.rs"

[[bin]]
name = "rsdiskwrite"
path = "src/main.rs"

[dependencies]
acme-core = { git = "https://github.com/stevenke1981/AcmeUI-Native.git", rev = "a3e758852b77c7e94c344a267c55d7cb7441c965" }
acme-platform = { git = "https://github.com/stevenke1981/AcmeUI-Native.git", rev = "a3e758852b77c7e94c344a267c55d7cb7441c965" }
acme-render-wgpu = { git = "https://github.com/stevenke1981/AcmeUI-Native.git", rev = "a3e758852b77c7e94c344a267c55d7cb7441c965" }
acme-text = { git = "https://github.com/stevenke1981/AcmeUI-Native.git", rev = "a3e758852b77c7e94c344a267c55d7cb7441c965" }
clap = { version = "4.5", features = ["derive", "wrap_help"] }
clap_complete = "4.5"
flate2 = "1.1"
rfd = "0.15"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
sha2 = "0.10"
tempfile = "3.27"
windows-sys = { version = "0.59", features = [
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
] }
